services:
  - type: web
    name: chat-with-docs-image
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    healthCheckPath: /_stcore/health
    envVars:
      - key: GOOGLE_API_KEY
        sync: false
    disk:
      name: chat-with-docs-data
      mountPath: /app/data
      sizeGB: 1
